services:
  - type: web
    name: devmentor-api
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MONGODB_URI
        scope: build
      - key: JWT_SECRET
        scope: build
      - key: CLAUDE_API_KEY
        scope: build
      - key: NODE_ENV
        value: production
